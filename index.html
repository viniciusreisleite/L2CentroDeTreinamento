<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - L2 Centro de Treinamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 3vh 3vw;
      gap: 3vw;
    }

    .media-column {
      flex: 0 0 35%;
      height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-color: #050505;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #050505;
    }

    .info-column {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #141414, #1a1a1a);
      border-radius: 20px;
      padding: 3.5vh 2.5vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #262626;
      position: relative;
    }

    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ff5722;
      padding-bottom: 2vh;
      margin-bottom: 2vh;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 2vw;
      font-weight: 900;
      color: #ff5722;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge {
      background: #ff5722;
      color: #fff;
      font-size: 0.8vw;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .brand-logo {
      height: 6.5vh;
      max-width: 13vw;
      object-fit: contain;
    }

    .caption-container {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .caption-text {
      width: 100%;
      color: #e5e5e5;
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="media-column">
      <img id="image-player" style="display:none;" />
      <video id="player" autoplay playsinline muted loop preload="auto">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-column">
      <div class="header-box">
        <div>
          <span class="badge">Nossa família cuidando da sua família</span>
          <h1 class="brand-title">L2 CENTRO DE TREINAMENTO</h1>
        </div>
        <img class="brand-logo" src="logo.png" alt="Logo L2">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-text" id="caption-text">Carregando...</div>
      </div>
    </div>
  </div>

  <script>
    function ajustarFonteTexto(container, elemento) {
      // Inicia com um tamanho proporcional grande e reduz gradualmente
      let fontSize = window.innerHeight * 0.024; // ~1.8vh inicial
      const minFontSize = window.innerHeight * 0.013; // ~1.0vh minimo legivel em TV

      elemento.style.fontSize = `${fontSize}px`;
      elemento.style.lineHeight = '1.45';

      // Reduz em passos ate que caiba sem overflow vertical
      while (elemento.scrollHeight > container.clientHeight && fontSize > minFontSize) {
        fontSize -= 0.5;
        elemento.style.fontSize = `${fontSize}px`;
      }

      // Se mesmo no tamanho minimo ainda ultrapassar, aperta levemente a entrelinha
      if (elemento.scrollHeight > container.clientHeight) {
        elemento.style.lineHeight = '1.3';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const timestamp = Date.now();
      const containerElem = document.getElementById('caption-container');
      const captionElem = document.getElementById('caption-text');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      try {
        const response = await fetch(`data.json?t=${timestamp}`);
        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) return;

        const urlParams = new URLSearchParams(window.location.search);
        const postParam = urlParams.get('post');
        const postIdx = parseInt(postParam, 10);

        let currentPost = posts[0];
        if (!isNaN(postIdx)) {
          currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
        }

        // Limpa excesso de quebras de linha vazias consecutivas (mais de 2 seguidas)
        let texto = currentPost.caption || currentPost.text || '';
        texto = texto.replace(/\n{3,}/g, '\n\n').trim();
        captionElem.textContent = texto;

        // Autoajuste do tamanho da fonte
        ajustarFonteTexto(containerElem, captionElem);
        window.addEventListener('resize', () => ajustarFonteTexto(containerElem, captionElem));

        // Midia
        const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
        const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

        if (isFoto) {
          if (player) {
            player.pause();
            player.style.display = 'none';
          }
          if (imagePlayer) {
            imagePlayer.style.display = 'block';
            imagePlayer.src = `${midiaArquivo}?t=${timestamp}`;
          }
        } else {
          if (imagePlayer) imagePlayer.style.display = 'none';
          if (player && videoSource) {
            player.style.display = 'block';
            videoSource.src = `${midiaArquivo}?t=${timestamp}`;
            player.load();
            player.play().catch(e => console.log('Autoplay:', e));
          }
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
