<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - L2 Centro de Treinamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 3vh 3vw;
      gap: 3vw;
    }

    .media-column {
      flex: 0 0 35%;
      height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-color: #050505;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #050505;
    }

    .info-column {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #141414, #1a1a1a);
      border-radius: 20px;
      padding: 4vh 3vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #262626;
      position: relative;
    }

    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ff5722;
      padding-bottom: 2.5vh;
      margin-bottom: 3vh;
    }

    .brand-title {
      font-size: 2.2vw;
      font-weight: 900;
      color: #ff5722;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge {
      background: #ff5722;
      color: #fff;
      font-size: 0.9vw;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .caption-container {
      flex: 1;
      overflow-y: hidden;
      position: relative;
    }

    .caption-text {
      font-size: 1.35vw;
      line-height: 1.6;
      color: #e0e0e0;
      font-weight: 500;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .brand-logo {
      height: 7vh;
      max-width: 15vw;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="media-column">
      <img id="image-player" style="display:none;" />
      <video id="player" autoplay playsinline muted loop preload="auto">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-column">
      <div class="header-box">
        <div>
          <span class="badge">Nossa família cuidando da sua família</span>
          <h1 class="brand-title">L2 CENTRO DE TREINAMENTO</h1>
        </div>
        <img class="brand-logo" src="logo.png" alt="Logo L2">
      </div>

      <div class="caption-container">
        <div class="caption-text" id="caption-text">Carregando informações...</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const timestamp = Date.now();
      const captionElem = document.getElementById('caption-text');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      try {
        const response = await fetch(`data.json?t=${timestamp}`);
        if (!response.ok) {
          captionElem.textContent = 'Erro ao carregar o arquivo data.json (' + response.status + ')';
          return;
        }
        
        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) {
          captionElem.textContent = 'Nenhum post disponível.';
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const postParam = urlParams.get('post');
        const postIdx = parseInt(postParam, 10);

        let currentPost = posts[0];
        if (!isNaN(postIdx)) {
          currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
        }

        // Injeta o texto com suporte a quebras de linha
        const textoDescricao = currentPost.caption || currentPost.text || 'L2 Centro de Treinamento - Treinos personalizados e qualidade de vida!';
        captionElem.textContent = textoDescricao;

        // Gerenciamento da mídia
        const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
        const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

        if (isFoto) {
          if (player) {
            player.pause();
            player.style.display = 'none';
          }
          if (imagePlayer) {
            imagePlayer.style.display = 'block';
            imagePlayer.src = `${midiaArquivo}?t=${timestamp}`;
          }
        } else {
          if (imagePlayer) imagePlayer.style.display = 'none';
          if (player && videoSource) {
            player.style.display = 'block';
            videoSource.src = `${midiaArquivo}?t=${timestamp}`;
            player.load();
            player.play().catch(e => console.log('Autoplay:', e));
          }
        }
      } catch (err) {
        console.error(err);
        captionElem.textContent = 'Erro de script: ' + err.message;
      }
    });
  </script>
</body>
</html>
