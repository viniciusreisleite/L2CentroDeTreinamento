<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural - L2 Centro de Treinamento</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tv-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
    }
    
    video, 
    .info-section {
      flex: 1;
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 3rem;
      background-color: #141414;
      color: #fff;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #262626;
      padding-bottom: 1.5rem;
      flex-shrink: 0;
    }
    .header-text .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 50px;
      text-transform: uppercase !important;
      letter-spacing: 1px;
      background: #ea580c;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .header-text h1 {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ea580c;
      line-height: 1.1;
      text-transform: uppercase !important;
    }
    .logo-img {
      max-height: 90px;
      max-width: 180px;
      object-fit: contain;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      margin-top: 2rem !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
      .video-section {
      flex: 0 0 42% !important;
      height: 100vh;
      background: #000 !important;
      background-color: #000 !important;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain !important;
      background: #000 !important;
      display: block;
    }
    
      #image-player {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000 !important;
      background-color: #000 !important;
    }
              /* === Layout Adaptativo Dinamico === */
    .tv-container {
      display: flex !important;
      width: 100vw !important;
      height: 100vh !important;
      padding: 1.5rem !important;
      gap: 1.5rem !important;
      box-sizing: border-box !important;
    }
    .video-section {
      height: 100% !important;
      background: #000 !important;
      border-radius: 24px !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      position: relative !important;
    }
    /* QUANDO FOR VIDEO */
    .tv-container.is-video .video-section {
      flex: 0 0 auto !important;
      aspect-ratio: 9 / 16 !important;
    }
    .tv-container.is-video video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 24px !important;
      display: block !important;
    }
    /* QUANDO FOR IMAGEM */
    .tv-container.is-image .video-section {
      flex: 0 0 auto !important;
      max-width: 45vw !important;
      background: #050505 !important;
    }
    .tv-container.is-image #image-player {
      width: auto !important;
      max-width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 20px !important;
      display: block !important;
    }
    .info-section {
      flex: 1 !important;
      height: 100% !important;
      max-height: 100% !important;
      border-radius: 24px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>

  <div class="tv-container is-video" id="main-container">
    <div class="video-section">
      <img id="image-player" style="display:none;" />
      <video id="player" autoplay playsinline muted loop preload="auto">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Nossa Família Cuidando da Sua Família</span>
          <h1>L2 Centro de Treinamento</h1>
        </div>
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações...
        </div>
      </div>
    </div>
  </div>

      <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(function() {
        var diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          var descendo = true;
          var pausado = false;

          window.__scrollInterval = setInterval(function() {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(function() {
                  descendo = false;
                  pausado = false;
                }, 3000);
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(function() {
                  pausado = false;
                }, 3500);
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var mainContainer = document.getElementById('main-container') || document.querySelector('.tv-container');
      var containerElem = document.getElementById('caption-container');
      var captionElem = document.getElementById('caption-text') || containerElem;
      var player = document.getElementById('player');
      var videoSource = document.getElementById('video-source');
      var imagePlayer = document.getElementById('image-player');

      var ts = new Date().getTime();

      fetch('data.json?v=' + ts)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(posts) {
          if (!Array.isArray(posts) || posts.length === 0) {
            if (captionElem) captionElem.textContent = 'Nenhuma publicação encontrada.';
            return;
          }

          var urlParams = new URLSearchParams(window.location.search);
          var postParam = urlParams.get('post');
          var postIdx = parseInt(postParam, 10);

          var currentPost = posts[0];
          if (!isNaN(postIdx)) {
            var encontrado = posts.filter(function(p) {
              return p.id === postIdx || String(p.id) === String(postIdx);
            });
            currentPost = (encontrado.length > 0) ? encontrado[0] : (posts[postIdx - 1] || posts[0]);
          }

          var texto = currentPost.caption || currentPost.text || '';
          texto = texto.replace(/\n{3,}/g, '\n\n').trim();

          if (captionElem) {
            captionElem.textContent = texto;
            iniciarAutoScroll(containerElem);
          }

          var midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
          var isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.indexOf('.jpg') !== -1 || midiaArquivo.indexOf('.png') !== -1));

          if (isFoto) {
            if (mainContainer) {
              mainContainer.classList.remove('is-video');
              mainContainer.classList.add('is-image');
            }
            if (player) {
              player.pause();
              player.style.display = 'none';
            }
            if (imagePlayer) {
              imagePlayer.style.display = 'block';
              imagePlayer.src = midiaArquivo + '?v=' + ts;
            }
          } else {
            if (mainContainer) {
              mainContainer.classList.remove('is-image');
              mainContainer.classList.add('is-video');
            }
            if (imagePlayer) imagePlayer.style.display = 'none';
            if (player && videoSource) {
              player.style.display = 'block';
              player.style.backgroundColor = '#000';
              player.muted = true;
              player.defaultMuted = true;
              player.loop = true;

              // Auto-ajuste dinâmico: vertical (9:16) ou horizontal/quadrado (layout flexível)
              player.onloadedmetadata = function() {
                if (player.videoWidth >= player.videoHeight) {
                  mainContainer.classList.remove('is-video');
                  mainContainer.classList.add('is-image');
                } else {
                  mainContainer.classList.remove('is-image');
                  mainContainer.classList.add('is-video');
                }
              };

              player.onended = function() {
                player.currentTime = 0;
                player.play().catch(function() {});
              };

              var mediaUrl = midiaArquivo + '?v=' + ts;
              videoSource.src = mediaUrl;
              player.src = mediaUrl;
              player.load();
              player.play().catch(function(e) {
                console.log('Autoplay:', e);
              });
            }
          }
        })
        .catch(function(err) {
          console.error('Erro ao carregar dados:', err);
          if (captionElem) captionElem.textContent = 'Erro ao carregar dados do mural.';
        });
    });
  </script>
</body>
</html>
